<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipper App - Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            max-width: 400px;
            width: 100%;
        }
        .app-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .app-logo i {
            font-size: 4rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 16px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 1rem;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .demo-credentials {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .demo-credentials h6 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .demo-credentials .credential-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .demo-credentials .credential-item strong {
            color: #333;
        }
        .demo-credentials .credential-item span {
            color: #667eea;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="app-logo">
                <i class="fas fa-shipping-fast"></i>
            </div>
            <h2 class="text-center mb-4">Shipper App</h2>
            <p class="text-center text-muted mb-4">Đăng nhập để quản lý đơn hàng</p>

            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <h6><i class="fas fa-info-circle me-1"></i>Thông tin demo:</h6>
                <div class="credential-item">
                    <strong>Shipper 1:</strong>
                    <span>shipper1@demo.com / 123456</span>
                </div>
                <div class="credential-item">
                    <strong>Shipper 2:</strong>
                    <span>shipper2@demo.com / 123456</span>
                </div>
                <div class="credential-item">
                    <strong>Shipper 3:</strong>
                    <span>shipper3@demo.com / 123456</span>
                </div>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-login" id="login-btn">
                    <span id="login-text">Đăng Nhập</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = window.location.origin + '/api/shipper-app';
        
        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const alertContainer = document.getElementById('alert-container');

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('shipper_token');
            const shipperInfo = localStorage.getItem('shipper_info');
            
            if (token && shipperInfo) {
                // Check if token is still valid
                fetch(`${API_BASE_URL}/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        // Token valid, redirect to dashboard
                        window.location.href = './dashboard.html';
                    } else {
                        // Token invalid, remove it
                        localStorage.removeItem('shipper_token');
                    }
                })
                .catch(() => {
                    // Error checking token, remove it
                    localStorage.removeItem('shipper_token');
                });
            }
        });

        // Login Form Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showAlert('Vui lòng nhập đầy đủ email và mật khẩu', 'danger');
                return;
            }
            
            // Show loading state
            setLoadingState(true);
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Save token
                    localStorage.setItem('shipper_token', data.data.token);
                    localStorage.setItem('shipper_info', JSON.stringify(data.data.shipper));
                    
                    showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = './dashboard.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Đăng nhập thất bại', 'danger');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Lỗi kết nối. Vui lòng thử lại sau.', 'danger');
            } finally {
                setLoadingState(false);
            }
        });

        // Show Alert
        function showAlert(message, type = 'info') {
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'danger' ? 'alert-danger' : 'alert-info';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'} me-1"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.remove();
                }
            }, 5000);
        }

        // Set Loading State
        function setLoadingState(loading) {
            loginBtn.disabled = loading;
            
            if (loading) {
                loginText.innerHTML = '<div class="loading-spinner me-2"></div>Đang đăng nhập...';
            } else {
                loginText.innerHTML = 'Đăng Nhập';
            }
        }
    </script>
</body>
</html>
